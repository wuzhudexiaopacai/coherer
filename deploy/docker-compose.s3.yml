# 可选：S3/MinIO 固件对象存储
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml --profile s3 up -d minio
# 然后在 backend/.env 设置：
#   COHERER_OTA_STORAGE_TYPE=s3
#   COHERER_OTA_S3_ENDPOINT=http://minio:9000
#   COHERER_OTA_S3_ACCESS_KEY=<MINIO_ROOT_USER>
#   COHERER_OTA_S3_SECRET_KEY=<MINIO_ROOT_PASSWORD>
#   COHERER_OTA_S3_BUCKET=coherer-firmware
services:
  minio:
    profiles: ["s3"]
    # 固定 digest，避免 latest 漂移；升级时同步更新 digest 并跑一次 S3 回归
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: coherer-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
