name: coherer

services:
  emqx:
    image: emqx/emqx:5.8.3
    container_name: coherer-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT
      - "8883:8883"     # MQTT over TLS
      - "8083:8083"     # MQTT over WebSocket（前端实时数据）
      - "8084:8084"     # MQTT over WSS
      - "18083:18083"   # 管理控制台
    environment:
      # HTTP 认证：回调宿主机后端（设备 HMAC 签名 / 后端服务账号）
      EMQX_AUTHENTICATION: |
        [
          {
            enable = true
            mechanism = password_based
            backend = http
            method = post
            url = "http://host.docker.internal:8081/internal/auth/mqtt"
            body {
              clientid = "$${clientid}"
              username = "$${username}"
              password = "$${password}"
            }
            headers {
              "Content-Type" = "application/json"
            }
          }
        ]
      # HTTP ACL：设备仅能操作自身主题，Web 只读订阅遥测，服务账号全放行
      EMQX_AUTHORIZATION__SOURCES: |
        [
          {
            type = http
            enable = true
            method = post
            url = "http://host.docker.internal:8081/internal/auth/acl"
            body {
              clientid = "$${clientid}"
              username = "$${username}"
              topic = "$${topic}"
              action = "$${action}"
            }
            headers {
              "Content-Type" = "application/json"
            }
          }
        ]
      EMQX_AUTHORIZATION__NO_MATCH: deny
      # TLS 监听器证书（首次启动前先执行 deploy/certs/gen-certs.sh）
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/etc/certs/server.crt
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/etc/certs/server.key
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: /opt/emqx/etc/certs/ca.crt
      EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/etc/certs/server.crt
      EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/etc/certs/server.key
      EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__CACERTFILE: /opt/emqx/etc/certs/ca.crt
    extra_hosts:
      # 让容器内可通过 host.docker.internal 访问宿主机（Linux 兼容）
      - "host.docker.internal:host-gateway"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - ./certs:/opt/emqx/etc/certs:ro
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: coherer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coherer
      POSTGRES_USER: coherer
      POSTGRES_PASSWORD: ${COHERER_DB_PASSWORD:?COHERER_DB_PASSWORD is required, see deploy/.env.example}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coherer -d coherer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coherer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  tdengine:
    image: tdengine/tdengine:3.3.6.0
    container_name: coherer-tdengine
    restart: unless-stopped
    ports:
      - "6030:6030"     # native
      - "6041:6041"     # REST / WebSocket（JDBC 走这里）
    volumes:
      - td-data:/var/lib/taos
      - td-log:/var/log/taos

volumes:
  emqx-data:
  emqx-log:
  pg-data:
  redis-data:
  td-data:
  td-log:
