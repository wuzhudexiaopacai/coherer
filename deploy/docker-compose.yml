name: coherer

# 开发编排：所有基础设施端口仅绑定 127.0.0.1，避免在局域网/公网暴露。
# 生产环境请通过反向代理（443）暴露前端与后端，MQTT 仅暴露 8883，其余走内网。

services:
  emqx:
    image: emqx/emqx:5.8.3
    container_name: coherer-emqx
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"     # MQTT（明文，仅本机调试）
      - "127.0.0.1:8883:8883"     # MQTT over TLS
      - "127.0.0.1:8083:8083"     # MQTT over WebSocket（前端实时数据）
      - "127.0.0.1:8084:8084"     # MQTT over WSS
      - "127.0.0.1:18083:18083"   # 管理控制台
    environment:
      # HTTP 认证：回调宿主机后端（设备 HMAC 签名 / 后端服务账号）
      EMQX_AUTHENTICATION: |
        [
          {
            enable = true
            mechanism = password_based
            backend = http
            method = post
            url = "http://host.docker.internal:8081/internal/auth/mqtt"
            body {
              clientid = "$${clientid}"
              username = "$${username}"
              password = "$${password}"
            }
            headers {
              "Content-Type" = "application/json"
              "X-Internal-Token" = "${COHERER_INTERNAL_TOKEN}"
            }
          }
        ]
      # HTTP ACL：设备仅能操作自身主题，Web 只读订阅遥测，服务账号全放行
      EMQX_AUTHORIZATION__SOURCES: |
        [
          {
            type = http
            enable = true
            method = post
            url = "http://host.docker.internal:8081/internal/auth/acl"
            body {
              clientid = "$${clientid}"
              username = "$${username}"
              topic = "$${topic}"
              action = "$${action}"
            }
            headers {
              "Content-Type" = "application/json"
              "X-Internal-Token" = "${COHERER_INTERNAL_TOKEN}"
            }
          }
        ]
      EMQX_AUTHORIZATION__NO_MATCH: deny
      # 管理控制台默认口令（仅首次初始化生效；已有数据卷用 emqx ctl admins passwd 修改）
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      # TLS 监听器证书（首次启动前先执行 deploy/certs/gen-certs.sh）
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/etc/certs/server.crt
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/etc/certs/server.key
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: /opt/emqx/etc/certs/ca.crt
      EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/etc/certs/server.crt
      EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/etc/certs/server.key
      EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__CACERTFILE: /opt/emqx/etc/certs/ca.crt
    extra_hosts:
      # 让容器内可通过 host.docker.internal 访问宿主机（Linux 兼容）
      - "host.docker.internal:host-gateway"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - ./certs:/opt/emqx/etc/certs:ro
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: coherer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coherer
      POSTGRES_USER: coherer
      POSTGRES_PASSWORD: ${COHERER_DB_PASSWORD:?COHERER_DB_PASSWORD is required, see deploy/.env.example}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coherer -d coherer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coherer-redis
    restart: unless-stopped
    # 必须设置口令：Redis 无认证时任何能访问端口的进程都可读写全部缓存
    command:
      - "redis-server"
      - "--requirepass"
      - "${COHERER_REDIS_PASSWORD:?COHERER_REDIS_PASSWORD is required, see deploy/.env.example}"
      - "--appendonly"
      - "yes"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$COHERER_REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      COHERER_REDIS_PASSWORD: ${COHERER_REDIS_PASSWORD}

  tdengine:
    image: tdengine/tdengine:3.3.6.0
    container_name: coherer-tdengine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6030:6030"     # native（仅本机调试）
      - "127.0.0.1:6041:6041"     # REST / WebSocket（JDBC 走这里）
    volumes:
      - td-data:/var/lib/taos
      - td-log:/var/log/taos
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6041"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 一次性任务：把 TDengine root 默认口令改为强口令（可重复执行）
  tdengine-init:
    image: curlimages/curl:8.10.1
    container_name: coherer-tdengine-init
    restart: "no"
    depends_on:
      tdengine:
        condition: service_started
    environment:
      COHERER_TDENGINE_PASSWORD: ${COHERER_TDENGINE_PASSWORD:?COHERER_TDENGINE_PASSWORD is required, see deploy/.env.example}
      TD_HOST: tdengine
    volumes:
      - ./tdengine/init-root-password.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: coherer-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      # 指标端点需要内部令牌；entrypoint 注入到临时配置，令牌不落仓库
      COHERER_INTERNAL_TOKEN: ${COHERER_INTERNAL_TOKEN:?COHERER_INTERNAL_TOKEN is required, see deploy/.env.example}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/entrypoint.sh:/entrypoint.sh:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: coherer-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      # 留空则指向本地占位地址，不对外发通知
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager-data:/alertmanager

  # 链路追踪查询后端：应用把 span 上报到 Zipkin，按 traceId 检索调用链
  zipkin:
    image: openzipkin/zipkin:3.4.3
    container_name: coherer-zipkin
    restart: unless-stopped
    ports:
      - "127.0.0.1:9411:9411"
    environment:
      STORAGE_TYPE: mem
      JAVA_OPTS: "-Xms128m -Xmx256m"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: coherer-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - zipkin

volumes:
  emqx-data:
  emqx-log:
  pg-data:
  redis-data:
  td-data:
  td-log:
  alertmanager-data:
  grafana-data:
  prometheus-data:
