spring:
  application:
    name: coherer-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/coherer?stringtype=unspecified
    username: coherer
    password: coherer123
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id            # 雪花 ID
      logic-delete-field: deleted   # 逻辑删除（实体含 deleted 字段时生效）
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  # 8080 常被本机其他服务占用，Coherer 固定使用 8081
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    # 开发期输出认证拒绝原因，便于联调
    com.github.wuzhudexiaopacai.internal.auth: DEBUG

coherer:
  security:
    # AES-256-GCM 主密钥（Base64，32 字节）。仅开发默认值；生产从环境变量/密钥管理注入
    secret-key: Y29oZXJlci1kZXYtc2VjcmV0LWtleS0zMi1ieXRlcyE=
  mqtt:
    broker-host: localhost
    broker-port: 1883
    # 后端服务账号：以该身份连接 EMQX 消费遥测（M2 起由认证回调校验）
    ingest:
      client-id: coherer-ingest
      username: service
      secret: coherer-ingest-dev-secret
    web:
      # 浏览器实时订阅：后端签发短时凭证，前端经 WebSocket 连接 EMQX
      secret: coherer-web-dev-secret
      ws-url: ws://localhost:8083/mqtt
      credential-ttl-seconds: 300
  tdengine:
    url: jdbc:TAOS-WS://localhost:6041
    username: root
    password: taosdata
