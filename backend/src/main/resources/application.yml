spring:
  application:
    name: coherer-backend
  config:
    # 本地开发：从 backend/.env 读取敏感配置（生产由环境变量/密钥管理注入）
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/coherer?stringtype=unspecified
    username: coherer
    password: ${COHERER_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id            # 雪花 ID
      logic-delete-field: deleted   # 逻辑删除（实体含 deleted 字段时生效）
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  # 8080 常被本机其他服务占用，Coherer 固定使用 8081
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      # Grafana P95/P99 面板与延迟告警依赖直方图桶
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: ${COHERER_TRACING_SAMPLE_RATE:1.0}

logging:
  # 结构化 JSON 日志（ECS 格式，包含 traceId/spanId）
  structured:
    format:
      console: ecs
  level:
    # 开发期输出认证拒绝原因，便于联调
    com.github.wuzhudexiaopacai.internal.auth: DEBUG

coherer:
  security:
    # AES-256-GCM 主密钥（Base64，32 字节），必须由环境变量注入
    secret-key: ${COHERER_SECRET_KEY}
    # JWT 签名密钥（至少 32 字节）与令牌有效期
    jwt-secret: ${COHERER_JWT_SECRET}
    jwt-access-ttl-seconds: 7200
    jwt-refresh-ttl-seconds: 604800
    # EMQX 回调 /internal/** 的共享令牌
    internal-token: ${COHERER_INTERNAL_TOKEN}
    # 首次启动初始化 admin 用户的口令
    admin-password: ${COHERER_ADMIN_PASSWORD}
  mqtt:
    broker-host: localhost
    broker-port: ${COHERER_MQTT_BROKER_PORT:1883}
    # 后端 → EMQX 是否启用 TLS（8883）及 CA 证书路径
    tls-enabled: ${COHERER_MQTT_TLS_ENABLED:false}
    ca-file: ${COHERER_MQTT_CA_FILE:../deploy/certs/ca.crt}
    # 后端服务账号：以该身份连接 EMQX 消费遥测（M2 起由认证回调校验）
    ingest:
      client-id: coherer-ingest
      username: service
      secret: ${COHERER_INGEST_SECRET}
    web:
      # 浏览器实时订阅：后端签发短时凭证，前端经 WebSocket 连接 EMQX
      secret: ${COHERER_WEB_SECRET}
      ws-url: ${COHERER_MQTT_WS_URL:ws://localhost:8083/mqtt}
      credential-ttl-seconds: 300
  tdengine:
    url: jdbc:TAOS-WS://localhost:6041
    username: root
    password: ${COHERER_TDENGINE_PASSWORD}
