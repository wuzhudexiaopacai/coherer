spring:
  application:
    name: coherer-backend
  servlet:
    multipart:
      # 固件包上传上限；超出由容器直接拒绝，避免大文件占满内存
      max-file-size: 64MB
      max-request-size: 66MB
  config:
    # 本地开发：从 backend/.env 读取敏感配置（生产由环境变量/密钥管理注入）
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${COHERER_DB_HOST:localhost}:${COHERER_DB_PORT:5432}/coherer?stringtype=unspecified${COHERER_DB_SSL_PARAMS:}
    username: coherer
    password: ${COHERER_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${COHERER_REDIS_HOST:localhost}
      port: ${COHERER_REDIS_PORT:6379}
      password: ${COHERER_REDIS_PASSWORD}
      timeout: 3s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id            # 雪花 ID
      logic-delete-field: deleted   # 逻辑删除（实体含 deleted 字段时生效）
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  # 8080 常被本机其他服务占用，Coherer 固定使用 8081
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 探针分组：liveness 只看进程存活，readiness 看依赖可用
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,diskSpace
      show-details: when_authorized
  metrics:
    distribution:
      # Grafana P95/P99 面板与延迟告警依赖直方图桶
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: ${COHERER_TRACING_SAMPLE_RATE:1.0}
  # Zipkin 接收端：trace 上报后可在 Zipkin UI 按 traceId 检索调用链
  zipkin:
    tracing:
      endpoint: ${COHERER_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  # 结构化 JSON 日志（ECS 格式，包含 traceId/spanId）
  structured:
    format:
      console: ecs
  level:
    # 开发期输出认证拒绝原因，便于联调
    com.github.wuzhudexiaopacai.internal.auth: DEBUG

coherer:
  host:
    # 主机在线标记 TTL：主机定期上报 online 续期
    online-ttl-seconds: ${COHERER_HOST_ONLINE_TTL_SECONDS:180}
    online-sweep-interval-ms: ${COHERER_HOST_ONLINE_SWEEP_INTERVAL_MS:60000}
    online-sweep-initial-delay-ms: ${COHERER_HOST_ONLINE_SWEEP_INITIAL_DELAY_MS:30000}
  device:
    # 设备在线标记 TTL：超过该时长没有任何消息即视为离线
    online-ttl-seconds: ${COHERER_DEVICE_ONLINE_TTL_SECONDS:180}
    # 在线状态巡检间隔与首次延迟
    online-sweep-interval-ms: ${COHERER_DEVICE_ONLINE_SWEEP_INTERVAL_MS:60000}
    online-sweep-initial-delay-ms: ${COHERER_DEVICE_ONLINE_SWEEP_INITIAL_DELAY_MS:30000}
  telemetry:
    # 幂等去重窗口：TTL 内同一设备重复投递只处理一次
    dedup-ttl-seconds: ${COHERER_TELEMETRY_DEDUP_TTL_SECONDS:600}
    # 写入缓冲：容量、批量大小、冲刷间隔
    buffer-capacity: ${COHERER_TELEMETRY_BUFFER_CAPACITY:10000}
    batch-size: ${COHERER_TELEMETRY_BATCH_SIZE:200}
    flush-interval-ms: ${COHERER_TELEMETRY_FLUSH_INTERVAL_MS:200}
  alarm:
    # 告警持续计时与活动认领在 Redis 中的存活时间
    condition-ttl-seconds: ${COHERER_ALARM_CONDITION_TTL_SECONDS:3600}
    active-ttl-seconds: ${COHERER_ALARM_ACTIVE_TTL_SECONDS:86400}
  security:    # AES-256-GCM 主密钥（Base64，32 字节），必须由环境变量注入
    secret-key: ${COHERER_SECRET_KEY}
    # JWT 签名密钥（至少 32 字节）与令牌有效期
    jwt-secret: ${COHERER_JWT_SECRET}
    jwt-access-ttl-seconds: 7200
    jwt-refresh-ttl-seconds: 604800
    # EMQX 回调 /internal/** 的共享令牌
    internal-token: ${COHERER_INTERNAL_TOKEN}
    # 首次启动初始化 admin 用户的口令
    admin-password: ${COHERER_ADMIN_PASSWORD}
  mqtt:
    broker-host: ${COHERER_MQTT_BROKER_HOST:localhost}
    broker-port: ${COHERER_MQTT_BROKER_PORT:1883}
    # 后端 → EMQX 是否启用 TLS（8883）及 CA 证书路径
    tls-enabled: ${COHERER_MQTT_TLS_ENABLED:false}
    ca-file: ${COHERER_MQTT_CA_FILE:../deploy/certs/ca.crt}
    # 后端服务账号：以该身份连接 EMQX 消费遥测（M2 起由认证回调校验）
    ingest:
      client-id: coherer-ingest
      username: service
      secret: ${COHERER_INGEST_SECRET}
    web:
      # 浏览器实时订阅：后端签发短时凭证，前端经 WebSocket 连接 EMQX
      secret: ${COHERER_WEB_SECRET}
      ws-url: ${COHERER_MQTT_WS_URL:ws://localhost:8083/mqtt}
      credential-ttl-seconds: 300
  tdengine:
    url: ${COHERER_TDENGINE_URL:jdbc:TAOS-WS://localhost:6041}
    username: root
    password: ${COHERER_TDENGINE_PASSWORD}
  ota:
    # 固件下载 URL 的对外基地址（设备可达的 Nginx HTTPS 地址）
    public-base-url: ${COHERER_OTA_PUBLIC_BASE_URL:https://localhost:8443}
    # 下载签名有效期；设备需在有效期内完成下载
    download-ttl-seconds: ${COHERER_OTA_DOWNLOAD_TTL_SECONDS:600}
    # 下载链接 HMAC 密钥（至少 16 字符），与 JWT/AES 密钥独立
    secret: ${COHERER_OTA_SECRET}
    # 固件本地存储目录（storage-type=local 时使用）
    firmware-dir: ${COHERER_OTA_FIRMWARE_DIR:../deploy/firmware}
    # 默认写入后端：local / s3；历史固件按自身 storage_type 路由
    storage-type: ${COHERER_OTA_STORAGE_TYPE:local}
    s3:
      endpoint: ${COHERER_OTA_S3_ENDPOINT:http://localhost:9000}
      access-key: ${COHERER_OTA_S3_ACCESS_KEY:}
      secret-key: ${COHERER_OTA_S3_SECRET_KEY:}
      bucket: ${COHERER_OTA_S3_BUCKET:coherer-firmware}
    # 任务超时与巡检间隔：超过该时长无进度即置为 TIMEOUT
    task-timeout-seconds: ${COHERER_OTA_TASK_TIMEOUT_SECONDS:600}
    timeout-sweep-interval-ms: ${COHERER_OTA_TIMEOUT_SWEEP_INTERVAL_MS:30000}
    # 灰度批次推进间隔（一次只推进一个 batch）
    rollout-sweep-interval-ms: ${COHERER_OTA_ROLLOUT_SWEEP_INTERVAL_MS:5000}
    rollout-sweep-initial-delay-ms: ${COHERER_OTA_ROLLOUT_SWEEP_INITIAL_DELAY_MS:10000}
    # 失败重试：线性退避基数（秒）、巡检间隔
    retry-backoff-seconds: ${COHERER_OTA_RETRY_BACKOFF_SECONDS:30}
    retry-sweep-interval-ms: ${COHERER_OTA_RETRY_SWEEP_INTERVAL_MS:10000}
    retry-sweep-initial-delay-ms: ${COHERER_OTA_RETRY_SWEEP_INITIAL_DELAY_MS:15000}
